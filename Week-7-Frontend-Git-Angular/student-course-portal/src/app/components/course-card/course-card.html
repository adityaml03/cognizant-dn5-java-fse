<div class="course-card">
  <h3>{{ course.name }}</h3>
  <p>{{ course.description }}</p>
  <p><strong>Instructor:</strong> {{ course.instructor }}</p>
  <p><strong>Duration:</strong> {{ course.duration }}</p>

  <button 
    [ngClass]="isEnrolled ? 'btn-unenroll' : 'btn-enroll'"
    (click)="onEnrollClick()">
    {{ isEnrolled ? 'Unenroll' : 'Enroll' }}
  </button>
</div>
