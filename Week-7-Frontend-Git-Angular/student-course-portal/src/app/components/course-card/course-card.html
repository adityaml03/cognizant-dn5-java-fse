<div *ngIf="course" class="card">
  <h3>{{ course.name }}</h3>
  <p><b>Code:</b> {{ course.code }}</p>
  <p><b>Credits:</b> {{ course.credits }}</p>

  <!-- Dynamic Button Text and Style -->
  <button 
    [ngClass]="isEnrolled ? 'btn-unenroll' : 'btn-enroll'" 
    (click)="onEnrollClick()">
    {{ isEnrolled ? 'Unenroll' : 'Enroll' }}
  </button>
</div>
