<div
  appHighlight="lightblue"
  [ngClass]="cardClasses"
  [ngStyle]="{'border-left':'6px solid ' + borderColor}">

  <h3>{{ course.name }}</h3>

  <p><b>Code:</b> {{ course.code }}</p>

  <p><b>{{ course.credits | creditLabel }}</b></p>

  <p>
    <span [ngSwitch]="course.gradeStatus">

      <span *ngSwitchCase="'passed'" style="color:green">
        Passed
      </span>

      <span *ngSwitchCase="'failed'" style="color:red">
        Failed
      </span>

      <span *ngSwitchDefault style="color:gray">
        Pending
      </span>

    </span>
  </p>

  <button (click)="toggleEnrollment()">
    {{ isEnrolled() ? 'Unenroll' : 'Enroll' }}
  </button>

  <button (click)="isExpanded = !isExpanded">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

</div>

<hr>
