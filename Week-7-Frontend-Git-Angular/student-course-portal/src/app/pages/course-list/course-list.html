<div class="course-container">
  <h2>Available Courses</h2>

  <div *ngIf="isLoading">
    <p>Loading courses...</p>
  </div>

  <div *ngIf="!isLoading && courses.length > 0" class="course-grid">
    <app-course-card 
      *ngFor="let course of courses" 
      [course]="course"
      (enroll)="onEnroll($event)">
    </app-course-card>
  </div>

  <div *ngIf="!isLoading && courses.length === 0">
    <p>No courses available.</p>
  </div>
</div>
