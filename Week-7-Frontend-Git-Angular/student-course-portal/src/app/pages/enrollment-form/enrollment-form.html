<h2>Student Enrollment Request</h2>

<form
#enrollForm="ngForm"
(ngSubmit)="onSubmit(enrollForm)">

<!-- Student Name -->

<label>

Student Name

</label>

<br>

<input
type="text"
name="studentName"
required
minlength="3"
[(ngModel)]="studentName"
#nameCtrl="ngModel">

<br>

<span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">

Name is required

</span>

<br>

<span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">

Name must be at least 3 characters

</span>

<br><br>

<!-- Email -->

<label>

Student Email

</label>

<br>

<input
type="email"
name="studentEmail"
required
email
[(ngModel)]="studentEmail"
#emailCtrl="ngModel">

<br>

<span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">

Email is required

</span>

<br>

<span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">

Invalid Email

</span>

<br><br>

<!-- Course -->

<label>

Course ID

</label>

<br>

<input
type="number"
name="courseId"
required
[(ngModel)]="courseId"
#courseCtrl="ngModel">

<br>

<span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">

Course ID is required

</span>

<br><br>

<!-- Semester -->

<label>

Preferred Semester

</label>

<br>

<select
name="preferredSemester"
required
[(ngModel)]="preferredSemester"
#semesterCtrl="ngModel">

<option value="">Select</option>

<option value="Odd">Odd</option>

<option value="Even">Even</option>

</select>

<br><br>

<!-- Terms -->

<label>

<input
type="checkbox"
name="agreeToTerms"
required
[(ngModel)]="agreeToTerms"
#termsCtrl="ngModel">

I Agree to Terms

</label>

<br>

<span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">

You must agree to continue

</span>

<br><br>

<button
type="submit"
[disabled]="enrollForm.invalid">

Submit

</button>

<button
type="button"
(click)="enrollForm.resetForm()">

Reset

</button>

</form>

<br>

<div *ngIf="submitted">

Enrollment request submitted successfully!

</div>
