<h1>{{ portalName }}</h1>

<p>Manage your courses, enrollments, and academic profile.</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<input
  type="text"
  placeholder="Search courses"
  [(ngModel)]="searchTerm">

<p>Searching for: {{ searchTerm }}</p>

<h2>Portal Statistics</h2>

<p>Courses Available: 12</p>
<p>Enrolled: 3</p>
<p>GPA: 3.8</p>
